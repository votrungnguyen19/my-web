<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website của tôi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Xin chào!</h1>

    <p>Đây là website của tôi.</p>

    <button onclick="hello()">
        Bấm vào đây
    </button>

    <script>
        function hello() {
            alert("Bạn vừa bấm vào nút!");
        }
    </script>

</body>
</html>
